name: Build SupJav Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supjav-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SupJav (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout SupJav build configuration
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout pinned Pake source
        uses: actions/checkout@v6
        with:
          repository: tw93/Pake
          ref: 1382507e007bb4b2e808971aacbe843b9bd220aa
          path: pake
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.26.2"
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pake/pnpm-lock.yaml

      - name: Setup Rust for Windows
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable-x86_64-msvc
          target: x86_64-pc-windows-msvc

      - name: Cache WiX Toolset
        uses: actions/cache@v4
        id: wix-cache
        with:
          path: C:\Program Files (x86)\WiX Toolset v3.11
          key: windows-wix-3.11.2

      - name: Install WiX Toolset
        if: steps.wix-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe" -OutFile "$env:RUNNER_TEMP\wix311.exe"
          $installer = Start-Process -FilePath "$env:RUNNER_TEMP\wix311.exe" -ArgumentList "/quiet" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "WiX installer failed with exit code $($installer.ExitCode)" }

      - name: Add WiX to PATH
        shell: powershell
        run: |
          $wixPath = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          if (-not (Test-Path $wixPath)) { throw "WiX not found at $wixPath" }
          $wixPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "pake/src-tauri -> target"
          shared-key: "supjav-pake-${{ runner.os }}"

      - name: Install Pake dependencies
        working-directory: pake
        run: pnpm install --frozen-lockfile

      - name: Apply SupJav ad-blocking patches
        working-directory: pake
        run: node ../scripts/prepare-pake.mjs

      - name: Build Pake CLI
        working-directory: pake
        run: pnpm run cli:build

      - name: Build SupJav EXE and MSI
        working-directory: pake
        shell: pwsh
        run: |
          node dist/cli.js --config ../supjav-pake.config.json
          if (-not (Test-Path "SupJav.exe")) { throw "SupJav.exe was not produced" }
          if (-not (Test-Path "SupJav.msi")) { throw "SupJav.msi was not produced" }
          Get-FileHash "SupJav.exe" -Algorithm SHA256
          Get-FileHash "SupJav.msi" -Algorithm SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SupJav-Windows-x64
          path: |
            pake/SupJav.exe
            pake/SupJav.msi
          if-no-files-found: error
          retention-days: 30
