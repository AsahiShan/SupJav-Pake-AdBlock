name: Build SupJav Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supjav-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SupJav (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout SupJav build configuration
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout pinned Pake source
        uses: actions/checkout@v6
        with:
          repository: tw93/Pake
          ref: 1382507e007bb4b2e808971aacbe843b9bd220aa
          path: pake
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.26.2"
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pake/pnpm-lock.yaml

      - name: Setup Rust for Windows
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable-x86_64-msvc
          target: x86_64-pc-windows-msvc

      - name: Use existing WiX Toolset or install it
        shell: pwsh
        run: |
          $searchRoots = @(
            "${env:ProgramFiles(x86)}",
            "$env:ProgramFiles",
            "C:\ProgramData\chocolatey\lib\wixtoolset",
            "C:\ProgramData\chocolatey\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }

          function Find-WixBin {
            $candleCommand = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($candleCommand) {
              $candidate = Split-Path -Parent $candleCommand.Source
              if (Test-Path (Join-Path $candidate "light.exe")) { return $candidate }
            }

            $candle = Get-ChildItem -Path $searchRoots -Filter "candle.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($candle) {
              $candidate = Split-Path -Parent $candle.FullName
              if (Test-Path (Join-Path $candidate "light.exe")) { return $candidate }
            }

            return $null
          }

          $wixBin = Find-WixBin

          if (-not $wixBin) {
            Write-Host "WiX was not found; installing the current Chocolatey wixtoolset package."
            choco install wixtoolset --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey could not install WiX Toolset (exit code $LASTEXITCODE)."
            }

            $searchRoots = @(
              "${env:ProgramFiles(x86)}",
              "$env:ProgramFiles",
              "C:\ProgramData\chocolatey\lib\wixtoolset",
              "C:\ProgramData\chocolatey\bin"
            ) | Where-Object { $_ -and (Test-Path $_) }

            $wixBin = Find-WixBin
          }

          if (-not $wixBin) {
            throw "WiX candle.exe and light.exe could not be located after checking installed tools and Chocolatey."
          }

          Write-Host "Using WiX tools from: $wixBin"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "pake/src-tauri -> target"
          shared-key: "supjav-pake-${{ runner.os }}"

      - name: Install Pake dependencies
        working-directory: pake
        run: pnpm install --frozen-lockfile

      - name: Apply SupJav ad-blocking patches
        working-directory: pake
        run: node ../scripts/prepare-pake.mjs

      - name: Build Pake CLI
        working-directory: pake
        run: pnpm run cli:build

      - name: Build SupJav EXE and MSI
        working-directory: pake
        shell: pwsh
        run: |
          node dist/cli.js --config ../supjav-pake.config.json

          $exe = Join-Path (Get-Location) "SupJav.exe"
          if (-not (Test-Path $exe)) {
            throw "SupJav.exe was not produced."
          }

          $msi = Get-ChildItem -Path . -Filter "SupJav_*.msi" -File |
            Select-Object -First 1
          if (-not $msi) {
            throw "No SupJav_*.msi installer was produced."
          }

          $msiOutput = Join-Path (Get-Location) "SupJav-Windows-x64.msi"
          Copy-Item -LiteralPath $msi.FullName -Destination $msiOutput -Force

          Write-Host "Build outputs:"
          Get-Item $exe, $msiOutput | Select-Object Name, Length | Format-Table -AutoSize
          Get-FileHash $exe -Algorithm SHA256
          Get-FileHash $msiOutput -Algorithm SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SupJav-Windows-x64
          path: |
            pake/SupJav.exe
            pake/SupJav-Windows-x64.msi
          if-no-files-found: error
          retention-days: 30
